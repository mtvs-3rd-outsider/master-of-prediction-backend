services:
  app:
    image: dudnjsckrgo/master-of-prediction-backend:latest
    env_file:
      - ./.env.k83
    ports:
      - "8766:8080"
    volumes:
      - ./src/main/resources/keystore.p12:/etc/config/ssl/keystore.p12
      - ./src/main/resources/firebase/master-of-prediction-384d0-firebase-adminsdk-47mce-780f4ac1f3.json:/etc/config/firebase/master-of-prediction-384d0-firebase-adminsdk-47mce-780f4ac1f3.json
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      debezium:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:sha256-fc898de747e8a4573c38f8bf976826449d8e5c320585f439b23476fc2bccf5f6
    container_name: elasticsearch
    environment:
      - node.name=es01
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  mongodb:
    restart: always
    image: mongo:7.0.14
    environment:
      MONGO_INITDB_ROOT_USERNAME: ohgiraffers
      MONGO_INITDB_ROOT_PASSWORD: ohgiraffers
      MONGO_INITDB_DATABASE: forecasthub
    ports:
      - "10001:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "ohgiraffers", "-p", "ohgiraffers", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    command: mongod --auth

  zookeeper:
    restart: always
    container_name: zookeeper
    image: bitnami/zookeeper:3.9.2
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: 'yes'
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9093", "--list"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    image: bitnami/kafka:3.3.2
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "my_connect_configs:1:3:compact,my_connect_offsets:1:3:compact,my_connect_statuses:1:3:compact,schemahistory.inventory:1:3:compact"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'

  debezium:
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    restart: always
    container_name: debezium
    image: debezium/connect:2.7.2.Final
    ports:
      - "8083:8083"
    depends_on:
      - zookeeper
      - kafka
      - mongodb
    environment:
      GROUP_ID: 1
      BOOTSTRAP_SERVERS: kafka:9092
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
      CONNECT_REST_ADVERTISED_PORT: 8083
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_TOPIC_CREATION_DEFAULT_RETENTION_MS: 86400000
      CONNECT_TOPIC_CREATION_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - ./init-scripts/initialize.sh:/kafka/startup.sh

volumes:
  es_data:
  mongo_data: 