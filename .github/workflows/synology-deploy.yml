name: Deploy to Synology NAS

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for Gradlew
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -x test

    - name: Build and Push Docker Images
      run: |
        docker build -t dudnjsckrgo/master-of-prediction-backend:latest .
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        docker push dudnjsckrgo/master-of-prediction-backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Copy docker-compose.yml and env files
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SYN_NAS_HOST }}
        username: ${{ secrets.SYN_NAS_USER }}
        key: ${{ secrets.SYN_NAS_SSH_KEY }}
        port: 2221
        source: "docker-compose.prod.yml,.env.k83,init-scripts/*"
        target: "/var/services/homes/dudnjsckrgo/docker/master-of-prediction-backend"

    - name: SSH Deploy
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SYN_NAS_HOST }}
        username: ${{ secrets.SYN_NAS_USER }}
        key: ${{ secrets.SYN_NAS_SSH_KEY }}
        debug: true
        port: 2221
        script: |
          export PATH=/usr/local/bin:$PATH
          
          cd /var/services/homes/dudnjsckrgo/docker/master-of-prediction-backend
          
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d