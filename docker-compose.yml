secrets:
  keystore_p12:
    file: ./src/main/resources/keystore.p12
  spring_firebase_config:
    file: ./src/main/resources/firebase/master-of-prediction-384d0-firebase-adminsdk-47mce-780f4ac1f3.json
  spring_secrets:
    file: ./secrets.env
  mail_secret:
    file: ./email-server-config/custom-certs/privkey1.pem
  mail_cert:
    file: ./email-server-config/custom-certs/cert1.pem
  minio_secret:
    file: ./certs/private.key
  minio_cert:
    file: ./certs/public.crt
services:

  initdb:
    image: busybox
    volumes:
      - ./init-scripts/my.cnf:/etc/mysql/my.cnf
    entrypoint: ["sh", "-c", "chmod 644 /etc/mysql/my.cnf"]
    profiles: ["db", "required","prod"]
  db:
    restart: always
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: forecasthub
      MYSQL_USER: ohgiraffers
      MYSQL_PASSWORD: ohgiraffers
      MYSQL_SSL_CA: ""
      MYSQL_SSL_CERT: ""
      MYSQL_SSL_KEY: ""
      TZ: "Asia/Seoul"
    depends_on:
      - initdb
    ports:
      - "9876:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts/my.cnf:/etc/mysql/my.cnf
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql  # SQL 스크립트 마운트
    profiles: ["db", "required","prod"]
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 20s
      retries: 20
      start_period: 240s
      timeout: 120s
  app:
    image: dudnjsckrgo/master-of-prediction-backend:latest
    env_file:
      - ./.env.k83
#    secrets:
#      - spring_secrets
#      - keystore_p12
#      - spring_firebase_config
#    environment:
#      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
#      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
#      DB_USER_PASSWORD: ${DB_USER_PASSWORD}
#      JWT_SECRET: ${JWT_SECRET}
#      DB_USER_NAME: ${DB_USER_NAME}
#      MAIL_PASSWORD: ${MAIL_PASSWORD}
#      MONGO_DB_URL: ${MONGO_DB_URL}
#      SSL_KEY_STORE_PASSWORD: ${SSL_KEY_STORE_PASSWORD}
#      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    ports:
      - "8080:8080"
    volumes:
      - ./src/main/resources/keystore.p12:/etc/config/ssl/keystore.p12
      - ./src/main/resources/firebase/master-of-prediction-384d0-firebase-adminsdk-47mce-780f4ac1f3.json:/etc/config/firebase/master-of-prediction-384d0-firebase-adminsdk-47mce-780f4ac1f3.json
    profiles: ["prod"]
    depends_on:
      mailserver:
        condition: service_started
      db:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      debezium:
        condition: service_healthy

  redis:
    restart: always
    image: "redis:latest"
    container_name: "my-redis"
    ports:
      - "6379:6379"
    profiles: ["cache", "required","prod"]
#      - cache

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./cert:/etc/prometheus/cert
      - ./prometheus-data:/prometheus
    ports:
      - "9090:9090"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    profiles:
      - monitoring

  rainloop:
    container_name: rainloop
    image: hardware/rainloop:latest
    ports:
      - "8020:8888"
    volumes:
      - ./email-server-config/data:/rainloop/data
    profiles:
      - email

  mailserver:
    image: docker.io/mailserver/docker-mailserver:latest
#    hostname: email.master-of-prediction.shop
    container_name: mailserver
    env_file:
      - ./email-server-config/mailserver.env
    ports:
      - "25:25"    # SMTP  (explicit TLS => STARTTLS)
      - "143:143"  # IMAP4 (explicit TLS => STARTTLS)
      - "465:465"  # ESMTP (implicit TLS)
      - "587:587"  # ESMTP (explicit TLS => STARTTLS)
      - "993:993"  # IMAP4 (implicit TLS)
#    secrets:
#      - mail_secret
#      - mail_cert
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
#      - /etc/localtime:/etc/localtime:ro
      - ./email-server-config/custom-certs:/etc/config
      - ./email-server-config/setup.sh:/usr/local/bin/setup.sh
      - ./email-server-config/config/:/tmp/docker-mailserver/${SELINUX_LABEL}
    restart: always
    stop_grace_period: 1m
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    profiles: ["prod","email"]
  minio:
    restart: always
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: MY-USER
      MINIO_ROOT_PASSWORD: MY-PASSWORD
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
#      - ./certs:/root/.minio/certs # SSL 인증서 마운트
    profiles: ["storage", "required"]
#      - storage
  minio-ssl:
    restart: always
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: MY-USER
      MINIO_ROOT_PASSWORD: MY-PASSWORD
    command: server /data --console-address ":9001"
#    secrets:
#      - source: minio_secret
#        target: /root/.minio/certs/private.key
#      - source: minio_cert
#        target: /root/.minio/certs/public.crt
    volumes:
      - ./certs:/root/.minio/certs # SSL 인증서 마운트:
      - minio-data:/data
    profiles: ["prod","minio"]
  master:
    image: locustio/locust
    command: ["-f", "/mnt/locustfile.py", "--master"]
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locustfile.py
    environment:
      - LOCUST_MODE=master
    profiles:
      - testing

  worker:
    image: locustio/locust
    command: ["-f", "/mnt/locustfile.py", "--worker", "--master-host", "master"]
    volumes:
      - ./locustfile.py:/mnt/locustfile.py
    depends_on:
      - master
    environment:
      - LOCUST_MODE=worker
    profiles:
      - testing

  zookeeper:
    restart: always
    container_name: zookeeper
    image: bitnami/zookeeper:3.9.2
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: 'yes'
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_CLIENT_PORT: 2181
#    volumes:
#      - zookeeper_data:/bitnami/zookeeper
    profiles: ["kafka", "required","prod"]
  debezium:
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    restart: always
    container_name: debezium
    image: debezium/connect:2.7.2.Final
    ports:
      - 8083:8083
    depends_on:
      - zookeeper
      - kafka
    environment:
      GROUP_ID: 1
      BOOTSTRAP_SERVERS: kafka:9092
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
      CONNECT_REST_ADVERTISED_PORT: 8083
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_TOPIC_CREATION_DEFAULT_RETENTION_MS: 86400000  # 기존 설정
      CONNECT_TOPIC_CREATION_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - ./init-scripts/initialize.sh:/kafka/startup.sh
    profiles: ["kafka", "required","prod"]
  connect-init:
    image: debezium/connect:2.7.2.Final
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./init-scripts/startup.sh:/kafka/startup.sh  # 스크립트 추가
      - ./init-scripts/mysql-connector.json:/kafka/connectors/mysql-connector.json
    entrypoint: ["/bin/bash", "/kafka/startup.sh"]
    profiles: ["kafka", "required","prod"]
  kafka:
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9093", "--list"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    image: bitnami/kafka:3.3.2
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"  # INTERNAL 리스너 포트
      - "9093:9093"  # EXTERNAL 리스너 포트
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "my_connect_configs:1:3:compact,my_connect_offsets:1:3:compact,my_connect_statuses:1:3:compact,schemahistory.inventory:1:3:compact"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'

#    volumes:
#      - kafka-data:/bitnami/kafka/data

    #      KAFKA_JMX_PORT: 9101
#      KAFKA_JMX_HOSTNAME: kafka
    profiles: ["kafka", "required","prod"]



  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: cluster-kafka-ui
    restart: always
    ports:
      - "9998:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: PLAINTEXT://kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:2181"
    depends_on:
      - zookeeper
      - kafka
    profiles: ["kafka"]

  mongodb:
    restart: always
    image: mongo:7.0.14
    environment:
      MONGO_INITDB_ROOT_USERNAME: ohgiraffers
      MONGO_INITDB_ROOT_PASSWORD: ohgiraffers
      MONGO_INITDB_DATABASE: forecasthub
    ports:
      - "10001:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "ohgiraffers", "-p", "ohgiraffers", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    command: mongod --auth
    profiles: ["mongo", "required","prod"]
  mongo-express:
    image: mongo-express:1.0.2-18
    restart: always
    ports:
      - "8086:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://ohgiraffers:ohgiraffers@mongodb:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin  # 기본 관리자 사용자 이름을 필요시 변경
      ME_CONFIG_BASICAUTH_PASSWORD: adminpassword  # 기본 관리자 비밀번호를 강력한 값으로 변경
    profiles: ["mongo"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:sha256-fc898de747e8a4573c38f8bf976826449d8e5c320585f439b23476fc2bccf5f6
    container_name: elasticsearch
    environment:
      - node.name=es01
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    restart: always
    profiles: ["es", "required","prod"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    restart: always
    container_name: kibana
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    profiles: ["es" ]

volumes:
  grafana-storage:
  maildata:
  mailstate:
  maillogs:
  minio-data:
  mc-config:
  mongo_data:
  mysql_data:
  zookeeper_data:
  kafka-data:
  es_data:
